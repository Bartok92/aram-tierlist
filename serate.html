<style>
  /* Layout: una prima pagina di giornale da fotografare col telefono. La "cartolina" in alto contiene
     tutto quello che conta (testata, titolo, derby, MVP, premi) in una schermata; sotto i dettagli. */
  /* Colori e caratteri comuni a tutte le pagine (tema scuro; chiaro se il dispositivo lo chiede) */
  :root {
    --sfondo: #0b0f17;
    --superficie: #131a26;
    --superficie-2: #1a2333;
    --linea: #263146;
    --testo: #eef2f8;
    --tenue: #97a3b8;
    --accento: #ff7a3d;
    --su-accento: #1b0c04;
    --accento-tenue: rgba(255, 122, 61, .15);
    --vittoria: #46c588;
    --sconfitta: #ff6b6b;
    --nuovo: #72a9ff;
    --oro: #e8b73d;
    --argento: #b9c2cd;
    --bronzo: #cf8c55;
    --su-tier: #15171c;
    --ombra: 0 18px 50px rgba(0, 0, 0, .45);
    --f-titoli: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --f-testo: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --raggio: 12px;
    --chip: 88px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --sfondo: #eef1f6; --superficie: #ffffff; --superficie-2: #f3f5f9; --linea: #d6dce6;
      --testo: #121826; --tenue: #566175; --accento: #d9480f; --su-accento: #ffffff;
      --accento-tenue: rgba(217, 72, 15, .09); --vittoria: #1e8f53; --sconfitta: #d0393c; --nuovo: #2563eb;
      --oro: #b8860b; --argento: #8a94a1; --bronzo: #a8642f; --ombra: 0 18px 50px rgba(18, 24, 38, .18);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --sfondo: #eef1f6; --superficie: #ffffff; --superficie-2: #f3f5f9; --linea: #d6dce6;
    --testo: #121826; --tenue: #566175; --accento: #d9480f; --su-accento: #ffffff;
    --accento-tenue: rgba(217, 72, 15, .09); --vittoria: #1e8f53; --sconfitta: #d0393c; --nuovo: #2563eb;
    --oro: #b8860b; --argento: #8a94a1; --bronzo: #a8642f; --ombra: 0 18px 50px rgba(18, 24, 38, .18);
    color-scheme: light;
  }
  :root { --f1: #5b9bff; --f2: #ff6262; --f1-tenue: rgba(91, 155, 255, .14); --f2-tenue: rgba(255, 98, 98, .14); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --f1: #1f63d6; --f2: #d33a3a; --f1-tenue: rgba(31, 99, 214, .09); --f2-tenue: rgba(211, 58, 58, .09); }
  }
  :root[data-theme="light"] { --f1: #1f63d6; --f2: #d33a3a; --f1-tenue: rgba(31, 99, 214, .09); --f2-tenue: rgba(211, 58, 58, .09); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--sfondo); color: var(--testo); font: 15px/1.45 var(--f-testo); }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; }
  .tenue { color: var(--tenue); }
  .pagina { max-width: 760px; margin: 0 auto; padding: 10px 16px 56px; display: grid; gap: 12px; }

  .barra { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .indietro, .scegli { font: 600 .8rem var(--f-testo); color: var(--testo); text-decoration: none; border: 1px solid var(--linea);
    background: var(--superficie); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .indietro:hover, .scegli:hover { border-color: var(--accento); }
  .scegli { min-width: 0; max-width: 64%; text-overflow: ellipsis; }

  /* ---------- la cartolina ---------- */
  .cartolina { width: 100%; max-width: 440px; justify-self: center; background: var(--superficie); border: 1px solid var(--linea);
    border-radius: 18px; overflow: hidden; box-shadow: var(--ombra); }
  .testata { padding: 10px 14px 8px; text-align: center; border-bottom: 2px solid var(--testo); background:
    linear-gradient(180deg, var(--accento-tenue), transparent); }
  .testata__nome { margin: 0; font: 800 1.6rem/1 var(--f-titoli); text-transform: uppercase; letter-spacing: .04em; }
  .testata__nome span { color: var(--accento); }
  .testata__riga { margin-top: 5px; display: flex; justify-content: center; flex-wrap: wrap; gap: 0 10px; font-size: .66rem;
    letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); font-weight: 600; }
  .provvisoria { color: var(--accento); }
  .notizia { padding: 10px 14px 2px; text-align: center; }
  .titolo { margin: 0; font: 800 1.45rem/1.02 var(--f-titoli); text-transform: uppercase; text-wrap: balance; }
  .occhiello { margin: 4px 0 0; color: var(--accento); font-weight: 700; font-size: .82rem; }

  .tabellone { margin: 8px 12px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px;
    padding: 8px 8px; border-radius: 14px; background: linear-gradient(90deg, var(--f1-tenue), transparent 45%, transparent 55%, var(--f2-tenue)); }
  .fazione { display: grid; gap: 5px; justify-items: center; text-align: center; }
  .fazione__nome { font: 800 .92rem/1.02 var(--f-titoli); text-transform: uppercase; }
  .fazione.f1 .fazione__nome { color: var(--f1); }
  .fazione.f2 .fazione__nome { color: var(--f2); }
  .volti { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
  .volti .avatar { width: 22px; height: 22px; }
  .punteggio { font: 800 2.3rem/1 var(--f-titoli); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .punteggio .vince { color: var(--testo); }
  .punteggio .perde { color: var(--tenue); }
  .striscia { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 7px 12px 0; }
  .striscia span { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: .62rem; font-weight: 800; color: #fff; }
  .striscia .f1 { background: var(--f1); } .striscia .f2 { background: var(--f2); }
  .mercato { margin: 4px 12px 0; text-align: center; font-size: .7rem; color: var(--tenue); }

  .mvp { margin: 8px 12px 0; display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px;
    border-radius: 14px; border: 1px solid var(--oro); background: linear-gradient(120deg, rgba(232, 183, 61, .16), transparent 70%); }
  .mvp .avatar { width: 46px; height: 46px; box-shadow: 0 0 0 2px var(--oro); }
  .mvp__etichetta { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--oro); font-weight: 700; }
  .mvp__nome { font: 800 1.3rem/1 var(--f-titoli); text-transform: uppercase; }
  .mvp__voto { text-align: right; font: 800 1.7rem/1 var(--f-titoli); color: var(--oro); }
  .mvp__voto small { display: block; font: 600 .58rem var(--f-testo); letter-spacing: .08em; color: var(--tenue); text-transform: uppercase; }

  .premi { padding: 8px 12px 0; display: grid; gap: 5px; }
  .premi__titolo { margin: 0; font: 800 .72rem/1 var(--f-titoli); letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }
  .griglia { display: grid; gap: 5px; }
  .griglia.gloria { grid-template-columns: repeat(3, 1fr); }
  .griglia.infamia { grid-template-columns: repeat(2, 1fr); }
  .premio { border: 1px solid var(--linea); border-radius: 10px; padding: 5px 7px; background: var(--superficie-2); min-width: 0; }
  .premio.gloria { border-color: rgba(232, 183, 61, .45); }
  .premio__testa { display: flex; align-items: center; gap: 4px; font-size: .58rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--tenue); line-height: 1.15; min-width: 0; }
  .premio__testa span:last-child { overflow-wrap: anywhere; }
  .premio__icona { font-size: .9rem; flex: none; }
  .premio__chi { margin-top: 2px; font: 800 .95rem/1.05 var(--f-titoli); text-transform: uppercase; overflow-wrap: anywhere; }
  .premio__testo { margin-top: 1px; font-size: .64rem; line-height: 1.22; color: var(--tenue); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .premio.vuoto .premio__chi { color: var(--tenue); font-family: var(--f-testo); font-size: .76rem; font-weight: 500; text-transform: none; }
  .piede { margin-top: 9px; padding: 7px 12px 8px; border-top: 1px solid var(--linea); display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 4px 10px; font-size: .68rem; color: var(--tenue); letter-spacing: .03em; }
  .piede strong { color: var(--accento); letter-spacing: .08em; text-transform: uppercase; }

  .avatar { border-radius: 50%; object-fit: cover; background: var(--superficie-2); display: inline-block; flex: none; }
  .avatar.iniziale { display: inline-grid; place-items: center; font: 800 .8em/1 var(--f-titoli); color: var(--tenue); border: 1px solid var(--linea); }

  /* ---------- dettagli sotto la cartolina ---------- */
  .blocco { display: grid; gap: 10px; margin-top: 10px; }
  .blocco h2 { margin: 0; font: 800 1.45rem/1 var(--f-titoli); text-transform: uppercase; letter-spacing: .02em; }
  .riquadro { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--raggio); overflow: hidden; }
  .partita { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--linea); }
  .partita:last-child { border-bottom: 0; }
  .partita__n { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 800 .95rem var(--f-titoli); color: #fff; }
  .partita__n.f1 { background: var(--f1); } .partita__n.f2 { background: var(--f2); } .partita__n.nd { background: var(--superficie-2); color: var(--tenue); }
  .partita__chi { font-size: .82rem; line-height: 1.35; }
  .partita__chi .vince { font-weight: 700; }
  .partita__chi .kill { white-space: nowrap; }
  .partita__ev { color: var(--accento); font-size: .76rem; font-weight: 600; }
  .partita__dx { text-align: right; font-size: .78rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--linea); white-space: nowrap; vertical-align: middle; }
  th { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
  th:first-child, td:first-child { text-align: left; }
  td.nome { font-weight: 600; white-space: normal; }
  td.nome .avatar { width: 28px; height: 28px; }
  .scorri { overflow-x: auto; }
  th .corto { display: none; }
  @media (max-width: 480px) { th .corto { display: inline; } }
  td.mese-impatto { white-space: nowrap; font-weight: 700; } td.mese-impatto small { display: block; font-weight: 400; font-size: .7rem; color: var(--tenue); } td.mese-impatto .su { color: var(--vittoria); } td.mese-impatto .giu { color: var(--sconfitta); }
  .archivio { display: grid; }
  .archivio__riga { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 2px 10px; padding: 10px 12px; border-bottom: 1px solid var(--linea); }
  .archivio__riga:last-child { border-bottom: 0; }
  .archivio__riga:hover, .archivio__riga[aria-current="true"] { background: var(--accento-tenue); }
  .archivio__apri { display: grid; gap: 2px; color: inherit; text-decoration: none; }
  .link-gioc { color: inherit; text-decoration: underline dotted 1px; text-underline-offset: 3px; }
  .link-gioc:hover, .link-gioc:focus-visible { color: var(--accento); text-decoration-style: solid; }
  .cartolina .link-gioc { text-decoration: none; }  /* nello screenshot niente sottolineature */
  .cartolina .link-gioc:hover { text-decoration: underline; }
  a.volto { display: inline-flex; border-radius: 50%; }
  .link-riga { display: inline-flex; align-items: center; gap: 8px; }
  .archivio__data { font-weight: 700; }
  .archivio__titolo { font-size: .8rem; color: var(--tenue); }
  .archivio__mvp { font-size: .8rem; color: var(--oro); font-weight: 600; text-align: right; }
  .albo { display: grid; }
  .albo div { display: grid; grid-template-columns: 30px 32px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--linea); }
  .albo div:last-child { border-bottom: 0; }
  .albo .pos { font: 800 1.05rem var(--f-titoli); color: var(--tenue); text-align: center; }
  .albo .avatar { width: 30px; height: 30px; }
  .albo .conti { display: grid; grid-template-columns: 3.1em 9.4em; align-items: baseline; font-size: .82rem; color: var(--tenue);
    text-align: left; font-variant-numeric: tabular-nums; }
  .albo .conti strong { color: var(--oro); font: 800 1.1rem var(--f-titoli); white-space: nowrap; }
  .nota { margin: 0; font-size: .8rem; color: var(--tenue); max-width: 76ch; }
  /* bacheca della serata: tag goliardici */
  .tag-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-flow: row dense; gap: 8px; }
  .tag { display: grid; align-content: start; gap: 2px; min-width: 0; padding: 9px 11px; border: 1px solid var(--linea); border-radius: 12px; background: var(--superficie); }
  .tag__testa { display: flex; align-items: center; gap: 6px; font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--tenue); line-height: 1.2; }
  .tag__icona { flex: none; font-size: 1.3rem; }
  .tag__chi { margin-top: 4px; font: 800 1.05rem/1.1 var(--f-titoli); text-transform: uppercase; overflow-wrap: anywhere; }
  .tag__testo { font-size: .74rem; line-height: 1.3; color: var(--tenue); }
  .tag.vuoto .tag__testo { margin-top: 4px; }
  /* a pari merito (o più cornuti) il riquadro prende tutta la riga, con i nomi affiancati */
  .tag.largo { grid-column: 1 / -1; }
  .tag__vincitori { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 12px; }
  .vuoto-pagina { text-align: center; padding: 40px 16px; color: var(--tenue); }

  @media (max-width: 480px) {
    th, td { padding: 8px 4px; }  /* sul telefono la tabella dei giocatori sta tutta nello schermo */
    th { letter-spacing: .03em; }
    .link-riga { gap: 6px; }
    td.nome .avatar { width: 20px; height: 20px; }
    th .lungo { display: none; }
  }
  @media (max-width: 380px) {
    .titolo { font-size: 1.5rem; }
    .testata__nome { font-size: 1.6rem; }
    .punteggio { font-size: 2.2rem; }
  }
</style>
</head>
<body>
<main class="pagina">
  <div class="barra">
    <a class="indietro" href="tierlist.html">← Classifica</a>
    <select class="scegli" id="scegli" aria-label="Scegli la serata"></select>
  </div>

  <div id="contenuto"></div>

<script>
(function () {
  'use strict';
  var dati = JSON.parse(document.getElementById('dati-serate').textContent);
  var contenuto = document.getElementById('contenuto');
  var scegli = document.getElementById('scegli');

  function el(tag, classe, testo) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (testo !== undefined && testo !== null) e.textContent = testo;
    return e;
  }
  function figli(padre, lista) { lista.forEach(function (f) { if (f) padre.appendChild(f); }); return padre; }
  function avatar(src, titolo) {
    if (!src) { var v = el('span', 'avatar iniziale', (titolo || '?').charAt(0).toUpperCase()); if (titolo) v.title = titolo; return v; }
    var i = document.createElement('img');
    i.className = 'avatar'; i.src = src; i.alt = titolo || ''; i.loading = 'lazy';
    i.onerror = function () { i.replaceWith(el('span', 'avatar iniziale', (titolo || '?').charAt(0).toUpperCase())); };
    return i;
  }
  // "vincono il derby 7–4": niente a capo dentro il risultato (il trattino lungo lo permetterebbe)
  function unito(testo) { return String(testo).replace(/(\d)–(\d)/g, '$1\u2060–\u2060$2'); }
  function numero(v) { return v === null || v === undefined ? '–' : v.toFixed(1).replace('.', ','); }
  // ogni nome porta al profilo del giocatore, nella classifica del mese della serata (dell'anno se non è una serata)
  function vistaPer(serataId) {
    if (!serataId) return 'anno';
    var mese = serataId.slice(0, 7);
    return mese === dati.mese_corrente ? 'mese' : 'mese-' + mese;
  }
  function linkProfilo(id, testo, serataId, classe, contenuto) {
    var a = el('a', 'link-gioc' + (classe ? ' ' + classe : ''), contenuto ? null : testo);
    if (contenuto) a.appendChild(contenuto);
    if (!id) return a;
    a.href = 'tierlist.html?profilo=' + encodeURIComponent(id) + '&vista=' + encodeURIComponent(vistaPer(serataId));
    a.title = 'Apri il profilo di ' + (testo || '');
    return a;
  }
  function durata(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  if (!dati.serate.length) {
    contenuto.appendChild(el('p', 'vuoto-pagina', 'Ancora nessuna serata da raccontare: servono almeno ' + dati.min_partite + ' partite tra di voi.'));
    scegli.hidden = true;
    return;
  }

  dati.serate.forEach(function (s) {
    var o = el('option', null, s.data.replace(/ \d{4}$/, '') + ' · ' + s.n_partite + ' partite');
    o.value = s.id;
    scegli.appendChild(o);
  });
  scegli.addEventListener('change', function () { location.hash = scegli.value; });

  function mostra() {
    var id = decodeURIComponent(location.hash.slice(1));
    var s = dati.serate.filter(function (x) { return x.id === id; })[0] || dati.serate[0];
    scegli.value = s.id;
    document.title = 'Gazzetta · ' + s.data;
    var chi = {};
    s.giocatori.forEach(function (g) { chi[g.id] = g; });
    function nome(id) { return chi[id] ? chi[id].nome : '?'; }
    function icona(id) { return chi[id] ? chi[id].icona : null; }

    contenuto.textContent = '';
    var pagina = el('div');
    pagina.style.display = 'grid'; pagina.style.gap = '14px';

    // ---------- cartolina ----------
    var c = el('article', 'cartolina');
    c.setAttribute('aria-label', 'Recap della serata');
    var testata = el('header', 'testata');
    var nomeT = el('h1', 'testata__nome');
    nomeT.append('La Gazzetta ', el('span', null, 'della Notte'));
    var riga = el('div', 'testata__riga');
    figli(riga, [el('span', null, s.data), el('span', null, s.orario), el('span', null, s.n_partite + ' partite · ' + s.giocatori.length + ' giocatori'),
      s.stato === 'provvisoria' ? el('span', 'provvisoria', 'provvisoria') : null]);
    figli(testata, [nomeT, riga]);
    c.appendChild(testata);

    var d = s.principale !== null ? s.derby[s.principale] : null;
    if (d) {
      var notizia = el('div', 'notizia');
      figli(notizia, [el('h2', 'titolo', unito(d.titolo)), el('p', 'occhiello', d.occhiello)]);
      c.appendChild(notizia);

      var tab = el('div', 'tabellone');
      var vince = d.fazioni[0].vinte === d.fazioni[1].vinte ? -1 : (d.fazioni[0].vinte > d.fazioni[1].vinte ? 0 : 1);
      function fazione(k) {
        var f = d.fazioni[k];
        var box = el('div', 'fazione f' + (k + 1));
        var volti = el('div', 'volti');
        f.nucleo.concat(f.ospiti).forEach(function (id) { volti.appendChild(linkProfilo(id, nome(id), s.id, 'volto', avatar(icona(id), nome(id)))); });
        figli(box, [el('div', 'fazione__nome', f.nome), volti]);
        return box;
      }
      var punti = el('div', 'punteggio');
      punti.append(el('span', vince === 1 ? 'perde' : 'vince', d.fazioni[0].vinte), document.createTextNode(' – '),
                   el('span', vince === 0 ? 'perde' : 'vince', d.fazioni[1].vinte));
      figli(tab, [fazione(0), punti, fazione(1)]);
      c.appendChild(tab);

      var strip = el('div', 'striscia');
      var cambi = {};
      d.trasferimenti.forEach(function (t) { cambi[t.partita] = true; });
      d.sequenza.forEach(function (v, i) {
        var n = d.partite[i];
        var p = el('span', 'f' + (v + 1), cambi[n] ? '⇄' : '');
        p.title = 'Partita ' + n + ': vince ' + d.fazioni[v].nome + (cambi[n] ? ' (cambio di squadra)' : '');
        strip.appendChild(p);
      });
      c.appendChild(strip);
      if (d.trasferimenti.length) {
        var mercato = el('p', 'mercato', '⇄ Mercato: ');
        var visti = {};
        d.trasferimenti.forEach(function (t) {
          if (visti[t.chi]) return;
          visti[t.chi] = true;
          if (mercato.childNodes.length > 1) mercato.appendChild(document.createTextNode(', '));
          mercato.appendChild(linkProfilo(t.chi, t.nome, s.id));
          mercato.appendChild(document.createTextNode(' (partita ' + t.partita + ')'));
        });
        c.appendChild(mercato);
      }
    }

    if (s.mvp) {
      var mvp = el('div', 'mvp');
      var centro = el('div');
      figli(centro, [el('div', 'mvp__etichetta', s.mvp.icona + ' ' + s.mvp.nome),
                     figli(el('div', 'mvp__nome'), [linkProfilo(s.mvp.chi, nome(s.mvp.chi), s.id)])]);
      var voto = el('div', 'mvp__voto', numero(s.mvp.voto));
      voto.appendChild(el('small', null, 'voto serata'));
      figli(mvp, [linkProfilo(s.mvp.chi, nome(s.mvp.chi), s.id, 'volto', avatar(icona(s.mvp.chi), nome(s.mvp.chi))), centro, voto]);
      c.appendChild(mvp);
    }

    function riquadri(tipo, titolo) {
      var premi = s.premi.filter(function (p) { return p.tipo === tipo; });
      if (!premi.length) return null;
      var box = el('section', 'premi');
      var griglia = el('div', 'griglia ' + tipo);
      premi.forEach(function (p) {
        var r = el('div', 'premio ' + tipo + (p.chi ? '' : ' vuoto'));
        var testa = el('div', 'premio__testa');
        figli(testa, [el('span', 'premio__icona', p.icona), el('span', null, p.nome)]);
        var vincitore = p.chi ? figli(el('div', 'premio__chi'), [linkProfilo(p.chi, nome(p.chi), s.id)]) : el('div', 'premio__chi', 'Non assegnato');
        figli(r, [testa, vincitore, p.chi ? el('div', 'premio__testo', p.testo) : null]);
        griglia.appendChild(r);
      });
      figli(box, [el('h3', 'premi__titolo', titolo), griglia]);
      return box;
    }
    figli(c, [riquadri('gloria', 'Gloria'), riquadri('infamia', 'Infamia')]);
    var piede = el('footer', 'piede');
    figli(piede, [el('strong', null, dati.etichetta || dati.titolo), el('span', null, dati.sito)]);
    c.appendChild(piede);
    pagina.appendChild(c);

    // ---------- bacheca della serata: tag solo per ridere ----------
    if (s.tag && s.tag.length) {
      var bloccoT = el('section', 'blocco');
      bloccoT.appendChild(el('h2', null, 'La bacheca della serata'));
      var griglia = el('div', 'tag-griglia');
      s.tag.forEach(function (x) {
        var r = el('div', 'tag' + (x.vincitori.length ? '' : ' vuoto'));
        r.appendChild(figli(el('div', 'tag__testa'), [el('span', 'tag__icona', x.icona), el('span', null, x.nome)]));
        if (!x.vincitori.length) r.appendChild(el('div', 'tag__testo', 'Nessuno stasera'));
        if (x.vincitori.length > 1) r.classList.add('largo');
        var vincitori = el('div', 'tag__vincitori');
        x.vincitori.forEach(function (v) {
          vincitori.appendChild(figli(el('div'), [figli(el('div', 'tag__chi'), [linkProfilo(v.chi, nome(v.chi), s.id)]),
                                                  el('div', 'tag__testo', v.testo)]));
        });
        if (x.vincitori.length) r.appendChild(vincitori);
        griglia.appendChild(r);
      });
      figli(bloccoT, [griglia, el('p', 'nota', 'Solo per ridere: i tag non contano in classifica, nei voti o nei premi. ' +
        'Valgono i totali della serata (per la Principessa le morti a partita) tra chi ha giocato almeno il ' +
        Math.round(dati.quota_presenze * 100) + '% delle partite; a pari merito il tag va a tutti. ' +
        'Cornuto: lo stesso campione almeno 2 volte in 5 partite di fila.')]);
      pagina.appendChild(bloccoT);
    }

    // ---------- altri derby della serata ----------
    if (s.derby.length > 1) {
      var altri = el('section', 'blocco');
      altri.appendChild(el('h2', null, 'Gli altri derby della serata'));
      var lista = el('div', 'riquadro');
      s.derby.forEach(function (x, i) {
        if (i === s.principale) return;
        var r = el('div', 'partita');
        figli(r, [el('span', 'partita__n nd', String(i + 1)), el('span', 'partita__chi', unito(x.titolo) + ' · ' + x.occhiello),
                  el('span', 'partita__dx', 'partite ' + x.partite[0] + '–' + x.partite[x.partite.length - 1])]);
        lista.appendChild(r);
      });
      figli(altri, [lista]);
      pagina.appendChild(altri);
    }

    // ---------- partita per partita ----------
    var bloccoP = el('section', 'blocco');
    bloccoP.appendChild(el('h2', null, 'Partita per partita'));
    var elencoP = el('div', 'riquadro');
    s.partite.forEach(function (p) {
      var r = el('div', 'partita');
      var colore = p.vince === null ? 'nd' : 'f' + (p.vince + 1);
      var testo = el('div', 'partita__chi');
      if (p.lati.length === 2 && p.derby !== null) {
        var der = s.derby[p.derby];
        [0, 1].forEach(function (k) {
          var linea = el('div', k === p.vince ? 'vince' : '');
          linea.appendChild(document.createTextNode((k === p.vince ? '🏆 ' : '') + der.fazioni[k].breve + ': '));
          p.lati[k].forEach(function (id, j) {
            if (j) linea.appendChild(document.createTextNode(', '));
            linea.appendChild(linkProfilo(id, nome(id), s.id));
          });
          linea.appendChild(document.createTextNode(' '));
          linea.appendChild(el('span', 'kill', '· ' + p.kill[k] + ' kill'));
          testo.appendChild(linea);
        });
      } else {
        testo.textContent = 'Partita senza derby tra di voi';
      }
      if (p.eventi.length) testo.appendChild(el('div', 'partita__ev', '⭐ ' + p.eventi.join(' · ')));
      figli(r, [el('span', 'partita__n ' + colore, String(p.n)), testo, el('span', 'partita__dx', p.ora + '\n' + durata(p.durata))]);
      r.lastChild.style.whiteSpace = 'pre-line';
      elencoP.appendChild(r);
    });
    bloccoP.appendChild(elencoP);
    pagina.appendChild(bloccoP);

    // ---------- giocatori ----------
    var bloccoG = el('section', 'blocco');
    bloccoG.appendChild(el('h2', null, 'I giocatori della serata'));
    var scorri = el('div', 'riquadro scorri');
    var t = el('table');
    var conMese = s.giocatori.some(function (g) { return g.mese; });
    var nomeMese = s.mese_impatto ? s.mese_impatto.charAt(0).toUpperCase() + s.mese_impatto.slice(1) : 'Mese';
    t.innerHTML = '<thead><tr><th>Giocatore</th><th title="Voto della serata: confronto con chi ha giocato quella sera">Voto</th>' +
      (conMese ? '<th title="Di quanto la serata ha spostato lo score nella classifica di ' + nomeMese.toLowerCase() + '">' +
                 '<span class="lungo">' + nomeMese + '</span><span class="corto">' + nomeMese.slice(0, 3) + '</span></th>' : '') +
      '<th title="Partite vinte su quelle giocate">Vinte</th><th>K/D/A</th></tr></thead>';
    // impatto sulla classifica del mese: [prima, dopo] -> "▲ 5,4" (con prima → dopo nel suggerimento)
    function cellaMese(g) {
      var td = el('td', 'mese-impatto');
      var m = g.mese, prima = m ? m[0] : null, dopo = m ? m[1] : null;
      if (prima !== null && dopo !== null) {
        var d = dopo - prima, verso = Math.abs(d) < 0.05 ? '' : d > 0 ? 'su' : 'giu';
        td.appendChild(el('span', verso, (verso === 'su' ? '▲ ' : verso === 'giu' ? '▼ ' : '= ') + numero(Math.abs(d))));
        td.appendChild(el('small', null, numero(prima) + ' → ' + numero(dopo)));
        td.title = nomeMese + ': ' + numero(prima) + ' → ' + numero(dopo);
      } else if (dopo !== null) {
        td.appendChild(el('span', 'su', 'entra'));
        td.appendChild(el('small', null, 'con ' + numero(dopo)));
        td.title = nomeMese + ': entra in classifica con ' + numero(dopo);
      } else {
        td.textContent = '–';
        td.title = 'Non ancora in classifica nel mese';
      }
      return td;
    }
    var corpo = el('tbody');
    s.giocatori.forEach(function (g) {
      var tr = el('tr');
      var td = el('td', 'nome');
      // avatar e nome dentro un solo collegamento (il nome una volta sola)
      var dentro = figli(el('span', 'link-riga'), [avatar(g.icona, g.nome), el('span', null, g.nome)]);
      td.appendChild(linkProfilo(g.id, g.nome, s.id, null, dentro));
      figli(tr, [td, el('td', null, numero(g.voto)), conMese ? cellaMese(g) : null, el('td', null, g.vittorie + '/' + g.partite),
                 el('td', null, g.k + '/' + g.d + '/' + g.a)]);
      corpo.appendChild(tr);
    });
    t.appendChild(corpo);
    scorri.appendChild(t);
    figli(bloccoG, [scorri, el('p', 'nota', 'Il voto della serata usa la stessa formula della classifica, sulle sole partite di quella sera, ' +
      'confrontando ognuno solo con chi ha giocato quella sera' + (conMese ? '; la colonna ' + nomeMese + ' dice invece di quanto la serata ha ' +
      'spostato lo score nella classifica del mese (▲ sale, ▼ scende; sotto, lo score prima → dopo). ' +
      'Possono andare in direzioni diverse: la classifica del mese confronta le medie di tutto il mese con quelle di tutti, ' +
      'e anche le partite degli altri la muovono. ' : '. ') +
      'Il voto lo riceve chi ha giocato almeno il ' + Math.round(dati.quota_presenze * 100) + '% delle partite. I premi vanno solo a chi si stacca davvero dagli altri ' +
      '(almeno ' + numero(dati.distacco) + ' deviazioni standard): se nessuno ci riesce, il premio resta vuoto.')]);
    pagina.appendChild(bloccoG);

    // ---------- archivio e albo d'oro ----------
    var bloccoA = el('section', 'blocco');
    bloccoA.appendChild(el('h2', null, 'Archivio delle serate'));
    var arch = el('nav', 'riquadro archivio');
    dati.serate.forEach(function (x) {
      var riga = el('div', 'archivio__riga');
      if (x.id === s.id) riga.setAttribute('aria-current', 'true');
      var a = el('a', 'archivio__apri');
      a.href = '#' + x.id;
      var mvpNome = x.mvp ? (x.giocatori.filter(function (g) { return g.id === x.mvp.chi; })[0] || {}).nome : null;
      var dd = x.principale !== null ? x.derby[x.principale] : null;
      figli(a, [el('span', 'archivio__data', x.data),
                el('span', 'archivio__titolo', unito(dd ? dd.titolo : x.n_partite + ' partite') + (x.stato === 'provvisoria' ? ' · provvisoria' : ''))]);
      figli(riga, [a, mvpNome ? linkProfilo(x.mvp.chi, '👑 ' + mvpNome, x.id, 'archivio__mvp') : null]);
      arch.appendChild(riga);
    });
    bloccoA.appendChild(arch);
    pagina.appendChild(bloccoA);

    if (dati.albo.length) {
      var bloccoO = el('section', 'blocco');
      bloccoO.appendChild(el('h2', null, "Albo d'oro " + dati.anno));
      var albo = el('div', 'riquadro albo');
      dati.albo.forEach(function (x, i) {
        var r = el('div');
        var conti = el('span', 'conti');
        conti.append(el('strong', null, '👑 ' + x.mvp), el('span', null, '· ' + x.premi + ' premi di gloria'));
        figli(r, [el('span', 'pos', String(i + 1)), linkProfilo(x.id, x.nome, null, 'volto', avatar(x.icona, x.nome)),
                  linkProfilo(x.id, x.nome, null), conti]);
        albo.appendChild(r);
      });
      figli(bloccoO, [albo, el('p', 'nota', 'Contano solo le serate "ufficiali": almeno ' + dati.ufficiale_partite + ' partite e ' + dati.ufficiale_giocatori + ' giocatori.')]);
      pagina.appendChild(bloccoO);
    }

    contenuto.appendChild(pagina);
  }

  window.addEventListener('hashchange', function () { mostra(); window.scrollTo(0, 0); });
  mostra();
})();
</script>
</body>
</html>
